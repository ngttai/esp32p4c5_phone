## IDF Component Manager Manifest File
dependencies:
  idf: ">=6.1"

  # Board support package, from its GitHub releases (https://github.com/ngttai/esp32p4c5_bsp).
  # To work on the BSP next to this repo, use override_path: "../../esp32p4c5_bsp/bsp/esp32p4c5_bsp" instead.
  esp32p4c5_bsp:
    git: https://github.com/ngttai/esp32p4c5_bsp.git
    path: bsp/esp32p4c5_bsp
    version: v0.2.0

  brookesia_core:
    version: "*"
    override_path: "../components/brookesia_core"

  brookesia_app_squareline_demo:
    version: "*"
    override_path: "../components/brookesia_app_squareline_demo"

  brookesia_app_calculator:
    version: "*"
    override_path: "../components/brookesia_app_calculator"

  brookesia_app_game_2048:
    version: "*"
    override_path: "../components/brookesia_app_game_2048"
